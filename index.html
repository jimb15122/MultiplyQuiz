<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Multiplication Practice</title>
<style>
  body {
    font-family: system-ui, Arial, sans-serif;
    margin: 8px;
    background: #f5f7fa;
  }
  h1 { font-size: 1.25rem; margin: 0 0 10px 0; }
  .controls, .bottom-controls { margin-bottom: 12px; }
  .bottom-controls { margin-top: 16px; }
  button {
    padding: 8px 14px;
    font-size: 1rem;
    margin-right: 6px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
  }
  button:hover { background: #eee; }
  #timer {
    display: inline-block;
    margin-left: 8px;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .name-box { margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .name-box label { font-weight: 600; }
  .name-box input[type="text"],
  .name-box input[type="number"] {
    padding: 6px 8px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .name-box input[type="text"] { width: 140px; max-width: 100%; }
  .name-box input[type="number"] { width: 60px; }
  .division-check { display: flex; align-items: center; gap: 4px; }
  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 100%;
    background: white;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    table-layout: fixed;
    margin-bottom: 16px;
  }
  th, td {
    border: 1px solid #d0d7de;
    padding: 4px 3px;
    text-align: center;
    white-space: nowrap;
    font-size: 0.95rem;
  }
  th { background: #f0f3f6; font-weight: 600; }
  .problem { font-weight: 600; }
  input[type="number"].answer {
    width: 100%;
    max-width: 70px;
    padding: 2px 1px;
    text-align: center;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 3px;
    box-sizing: border-box;
  }
  .emoji { font-size: 1.2rem; margin-left: 4px; }
  .correct { background: #d4edda !important; color: #155724; }
  .incorrect { background: #f8d7da !important; color: #721c24; }
  #message { margin-top: 10px; font-size: 1rem; line-height: 1.5; }
  .rating { font-weight: 600; }
  #historyTable { font-size: 0.9rem; }
  #historyTable th, #historyTable td { 
    padding: 6px 2px; 
    font-size: 0.85rem;
  }
  .clear-history { margin-top: 8px; font-size: 0.85rem; }
  #problemCount { font-size: 0.9rem; color: #555; margin-bottom: 8px; }
</style>
</head>
<body>
<h1>Multiplication / Division Practice</h1>

<div class="name-box">
  <label for="childName">Name:</label>
  <input type="text" id="childName" placeholder="Enter name">
  <label for="maxNum">Max:</label>
  <input type="number" id="maxNum" value="12" min="2" max="20">
  <label class="division-check">
    <input type="checkbox" id="divisionMode">
    Division
  </label>
</div>

<div class="controls">
  <button id="startBtn">Start</button>
  <button id="doneBtn" disabled>Done</button>
  <span id="timer">Time: 0:00</span>
</div>

<div id="problemCount"></div>

<table id="quizTable">
  <thead>
    <tr>
      <th style="width: 10%;">#</th>
      <th style="width: 40%;">Problem</th>
      <th style="width: 50%;">Your Answer</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div class="bottom-controls">
  <button id="startBtnBottom">Start</button>
  <button id="doneBtnBottom" disabled>Done</button>
</div>

<div id="message"></div>
<div id="historyContainer"></div>

<script>
const TARGET_TOTAL = 25;
const MIN = 2;
const STORAGE_KEY = 'multiplicationHistory';

let startTime = null;
let timerInterval = null;
let answers = [];
let history = [];
let actualTotal = 0;

const tbody = document.getElementById('tbody');
const startBtn = document.getElementById('startBtn');
const doneBtn = document.getElementById('doneBtn');
const startBtnBottom = document.getElementById('startBtnBottom');
const doneBtnBottom = document.getElementById('doneBtnBottom');
const timerEl = document.getElementById('timer');
const messageEl = document.getElementById('message');
const nameInput = document.getElementById('childName');
const maxNumInput = document.getElementById('maxNum');
const divisionCheckbox = document.getElementById('divisionMode');
const historyContainer = document.getElementById('historyContainer');
const problemCountEl = document.getElementById('problemCount');

function loadHistory() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    history = saved ? JSON.parse(saved) : [];
  } catch (e) {
    history = [];
  }
}

function saveHistory() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateUniqueProblems(max, isDivision) {
  const all = [];
  for (let a = MIN; a <= max; a++) {
    for (let b = MIN; b <= max; b++) {
      const product = a * b;
      if (isDivision) {
        all.push({
          display: `${product} ÷ ${a}`,
          answer: b
        });
      } else {
        all.push({
          display: `${a} × ${b}`,
          answer: product
        });
      }
    }
  }

  // Shuffle
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }

  return all.slice(0, TARGET_TOTAL);
}

function formatTime(totalSeconds) {
  const mins = Math.floor(totalSeconds / 60);
  const secs = Math.floor(totalSeconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function getSpeedRating(avgSeconds) {
  if (avgSeconds < 2.5) return "Eagle - Extreme Speed 🦅";
  if (avgSeconds < 3.5) return "Cheetah - Very Fast 🐆";
  if (avgSeconds < 4.5) return "Horse - Fast 🐎";
  if (avgSeconds < 6) return "Dog - Average 🐕";
  if (avgSeconds < 7.5) return "Hedgehog - Below Average 🦔";
  if (avgSeconds < 9) return "Turtle - Slow 🐢";
  return "Snail - Very Slow 🐌";
}

function getSpeedEmoji(avgSeconds) {
  if (avgSeconds < 2.5) return "🦅";
  if (avgSeconds < 3.5) return "🐆";
  if (avgSeconds < 4.5) return "🐎";
  if (avgSeconds < 6) return "🐕";
  if (avgSeconds < 7.5) return "🦔";
  if (avgSeconds < 9) return "🐢";
  return "🐌";
}

function getAccuracyRating(percentage) {
  if (percentage === 100) return "Perfect 💯";
  if (percentage >= 96) return "Precise 🎯";
  if (percentage >= 88) return "Very Accurate 🤓";
  if (percentage >= 76) return "Good 😃";
  if (percentage >= 64) return "Fair 🙂";
  if (percentage >= 48) return "Uncertain 😕";
  return "Random Guess 🎲";
}

function getAccuracyEmoji(percentage) {
  if (percentage === 100) return "💯";
  if (percentage >= 96) return "🎯";
  if (percentage >= 88) return "🤓";
  if (percentage >= 76) return "😃";
  if (percentage >= 64) return "🙂";
  if (percentage >= 48) return "😕";
  return "🎲";
}

function setButtonsEnabled(startEnabled, doneEnabled) {
  startBtn.disabled = !startEnabled;
  startBtnBottom.disabled = !startEnabled;
  doneBtn.disabled = !doneEnabled;
  doneBtnBottom.disabled = !doneEnabled;
}

function renderHistory() {
  if (history.length === 0) {
    historyContainer.innerHTML = '';
    return;
  }

  const sorted = [...history].reverse();

  let html = `
    <h2 style="font-size:1.1rem; margin:16px 0 8px 0;">History</h2>
    <table id="historyTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Score</th>
          <th></th>
          <th>Time/Ans</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
  `;

  sorted.forEach(entry => {
    html += `
      <tr>
        <td>${entry.name}</td>
        <td>${entry.type || '×'}</td>
        <td>${entry.percentage}%</td>
        <td>${entry.scoreEmoji}</td>
        <td>${entry.avg.toFixed(1)}s</td>
        <td>${entry.timeEmoji}</td>
      </tr>
    `;
  });

  html += `
      </tbody>
    </table>
    <button class="clear-history" onclick="clearHistory()">Clear History</button>
  `;

  historyContainer.innerHTML = html;
}

function clearHistory() {
  if (confirm('Clear all history?')) {
    history = [];
    saveHistory();
    renderHistory();
  }
}

function startQuiz() {
  clearInterval(timerInterval);
  messageEl.textContent = '';
  answers = [];

  const max = Math.max(2, Math.min(20, parseInt(maxNumInput.value) || 12));
  const isDivision = divisionCheckbox.checked;
  const uniqueProblems = generateUniqueProblems(max, isDivision);

  actualTotal = uniqueProblems.length;
  problemCountEl.textContent = `Problems: ${actualTotal}` + (actualTotal < TARGET_TOTAL ? ` (only ${actualTotal} unique available with max ${max})` : '');

  // Rebuild table with exact number of rows needed
  tbody.innerHTML = '';
  uniqueProblems.forEach((prob, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td class="problem">${prob.display}</td>
      <td>
        <input type="number" class="answer" min="0" step="1">
        <span class="emoji"></span>
      </td>
    `;
    tbody.appendChild(tr);
    answers.push(prob.answer);
  });

  startTime = performance.now();
  timerInterval = setInterval(updateTimer, 100);
  updateTimer();

  setButtonsEnabled(false, true);
  const firstInput = document.querySelector('input.answer');
  if (firstInput) firstInput.focus();
}

function updateTimer() {
  if (!startTime) return;
  const elapsed = (performance.now() - startTime) / 1000;
  timerEl.textContent = `Time: ${formatTime(elapsed)}`;
}

function finishQuiz() {
  clearInterval(timerInterval);
  const totalSeconds = (performance.now() - startTime) / 1000;
  const avgSeconds = totalSeconds / actualTotal || 1;
  const timeStr = formatTime(totalSeconds);

  timerEl.textContent = `Time: ${timeStr}`;

  let correctCount = 0;
  const rows = tbody.querySelectorAll('tr');

  rows.forEach((row, idx) => {
    const input = row.querySelector('input.answer');
    const emojiSpan = row.querySelector('.emoji');
    const userVal = input.value.trim();
    const correct = answers[idx];

    input.disabled = true;

    if (userVal !== '' && Number(userVal) === correct) {
      input.classList.add('correct');
      emojiSpan.textContent = '✅';
      correctCount++;
    } else {
      input.classList.add('incorrect');
      emojiSpan.textContent = '❌';
    }
  });

  const percentage = Math.round((correctCount / actualTotal) * 100);
  const childName = nameInput.value.trim() || "Student";
  const speedRating = getSpeedRating(avgSeconds);
  const accuracyRating = getAccuracyRating(percentage);
  const scoreEmoji = getAccuracyEmoji(percentage);
  const timeEmoji = getSpeedEmoji(avgSeconds);
  const quizType = divisionCheckbox.checked ? '÷' : '×';

  messageEl.innerHTML = `
    <div><strong>${childName}</strong>'s Results</div>
    <div>Score: <strong>${correctCount}/${actualTotal} (${percentage}%)</strong> ${scoreEmoji}</div>
    <div>Total time: <strong>${timeStr}</strong></div>
    <div>Average time: <strong>${avgSeconds.toFixed(1)} seconds</strong> per problem ${timeEmoji}</div>
    <div class="rating">Speed: ${speedRating}</div>
    <div class="rating">Accuracy: ${accuracyRating}</div>
  `;

  history.push({
    name: childName,
    type: quizType,
    percentage,
    scoreEmoji,
    avg: avgSeconds,
    timeEmoji
  });

  saveHistory();
  renderHistory();

  setButtonsEnabled(true, false);
}

// Auto-clear answer boxes on focus
tbody.addEventListener('focusin', (e) => {
  if (e.target.classList.contains('answer') && !e.target.disabled) {
    e.target.value = '';
  }
});

// Initialize
loadHistory();
renderHistory();

startBtn.addEventListener('click', startQuiz);
startBtnBottom.addEventListener('click', startQuiz);
doneBtn.addEventListener('click', finishQuiz);
doneBtnBottom.addEventListener('click', finishQuiz);
</script>
</body>
</html>
