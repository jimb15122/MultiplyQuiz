<!DOCTYPE html>
<html lang="en">
<head>
<link rel="apple-touch-icon" href="favicon.png">
<link rel="icon" href="favicon.png" type="image/png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Math Practice</title>
<style>
  body {
    font-family: system-ui, Arial, sans-serif;
    margin: 8px;
    background: #f5f7fa;
    padding-bottom: 180px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 { font-size: 1.25rem; margin: 0 0 10px 0; }
  .controls, .bottom-controls { margin-bottom: 12px; }
  .bottom-controls { margin-top: 16px; }
  button {
    padding: 8px 14px;
    font-size: 1rem;
    margin-right: 6px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
  }
  button:hover { background: #eee; }
  .op-btn { font-size: 1.3rem; font-weight: 800; min-width: 48px; }
  #timer {
    display: inline-block;
    margin-left: 8px;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .name-box { margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .name-box label { font-weight: 600; }
  .name-box input[type="text"],
  .name-box input[type="number"] {
    padding: 6px 8px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .name-box input[type="text"] { width: 140px; max-width: 100%; }
  .name-box input[type="number"] { width: 60px; }
  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 100%;
    background: white;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    table-layout: fixed;
    margin-bottom: 16px;
  }
  th, td {
    border: 1px solid #d0d7de;
    padding: 4px 3px;
    text-align: center;
    white-space: nowrap;
    font-size: 0.95rem;
  }
  th { background: #f0f3f6; font-weight: 600; }
  .problem { font-weight: 600; font-size: 1.1rem;}
  input.answer {
    width: 100%;
    max-width: 70px;
    padding: 6px 2px;
    text-align: center;
    font-size: 1.1rem;
    border: 1px solid #ccc;
    border-radius: 3px;
    box-sizing: border-box;
    -webkit-appearance: none;
    background: transparent;
  }
  .emoji { font-size: 1.2rem; margin-left: 4px; }
  .correct { background: #d4edda !important; color: #155724; }
  .incorrect { background: #f8d7da !important; color: #721c24; }
  .focused-row { background: #fff9c4 !important; }
  #message { margin-top: 10px; font-size: 1rem; line-height: 1.5; }
  .rating { font-weight: 600; }
  #historyTable { font-size: 0.9rem; }
  #historyTable th, #historyTable td { 
    padding: 6px 2px; 
    font-size: 0.85rem;
  }
  #historyTable tbody tr { position: relative; }
  
    
  #historyTable td:nth-child(2) {
    font-size: 1.4rem;
    font-weight: bold;
  }

  #problemCount { font-size: 0.9rem; color: #555; margin-bottom: 8px; }

  #keypad {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #f0f3f6;
    border-top: 1px solid #ccc;
    padding: 10px 8px 12px 8px;
    z-index: 1000;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
    user-select: none;
  }
  #keypad.active { display: block; }
  .keypad-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    justify-content: center;
  }
  .key {
    flex: 1;
    max-width: 70px;
    height: 58px;
    font-size: 1.8rem;
    font-weight: 600;
    border: 1px solid #bbb;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .key:active { background: #e0e0e0; }
  .key.wide { max-width: none; flex: 1; font-size: 1.3rem; }

  .flyout {
    position: absolute;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 2000;
    padding: 4px 0;
    min-width: 100px;
  }
  .flyout button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 12px;
    border: none;
    background: none;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .flyout button:hover { background: #f0f0f0; }
  .flyout .delete { color: #c0392b; }
  
  
  

  
</style>
</head>
<body>
<h1><img src="favicon.png" alt="" 
      style="height:1.2em; 
      vertical-align:middle; 
      margin-right:8px;">
  Math Practice</h1>

<div class="name-box">
  <label for="childName">Name:</label>
  <input type="text" id="childName" placeholder="Enter name">
  <label for="maxNum">Max:</label>
  <input type="number" id="maxNum" value="12" min="2" max="20">
</div>

<div class="controls">
  <strong>Start:</strong>
  <button class="op-btn" data-op="+">+</button>
  <button class="op-btn" data-op="−">-</button>
  <button class="op-btn" data-op="×">×</button>
  <button class="op-btn" data-op="÷">÷</button>
  <span id="timer">Time: 0:00</span>
</div>

<div id="problemCount"></div>

<table id="quizTable">
  <thead>
    <tr>
      <th style="width: 10%;">#</th>
      <th style="width: 40%;">Problem</th>
      <th style="width: 50%;">Your Answer</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div id="keypad">
  <div class="keypad-row">
    <div class="key" data-digit="1">1</div>
    <div class="key" data-digit="2">2</div>
    <div class="key" data-digit="3">3</div>
    <div class="key" data-digit="4">4</div>
    <div class="key" data-digit="5">5</div>
  </div>
  <div class="keypad-row">
    <div class="key" data-digit="6">6</div>
    <div class="key" data-digit="7">7</div>
    <div class="key" data-digit="8">8</div>
    <div class="key" data-digit="9">9</div>
    <div class="key" data-digit="0">0</div>
  </div>
  <div class="keypad-row">
    <div class="key wide" id="backspaceKey">⌫</div>
    <div class="key wide" id="enterKey">Enter</div>
  </div>
</div>

<div class="bottom-controls">
   
  <button id="doneBtnBottom" disabled>Done</button>
</div>

<div id="message"></div>
<div id="historyContainer"></div>

<script>
const TARGET_TOTAL = 25;
const MIN = 2;
const HISTORY_KEY = 'multiplicationHistory';
const SETTINGS_KEY = 'multiplicationSettings';

let startTime = null;
let timerInterval = null;
let answers = [];
let history = [];
let actualTotal = 0;
let activeInput = null;
let quizActive = false;
let wakeLock = null;
let longPressTimer = null;
let currentFlyout = null;
let currentOp = '×';

const tbody = document.getElementById('tbody');

  
const doneBtnBottom = document.getElementById('doneBtnBottom');
const timerEl = document.getElementById('timer');
const messageEl = document.getElementById('message');
const nameInput = document.getElementById('childName');
const maxNumInput = document.getElementById('maxNum');
const historyContainer = document.getElementById('historyContainer');
const problemCountEl = document.getElementById('problemCount');
const keypad = document.getElementById('keypad');

function loadHistory() {
  try {
    const saved = localStorage.getItem(HISTORY_KEY);
    history = saved ? JSON.parse(saved) : [];
  } catch (e) {
    history = [];
  }
}

function saveHistory() {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function loadSettings() {
  try {
    const saved = localStorage.getItem(SETTINGS_KEY);
    if (saved) {
      const settings = JSON.parse(saved);
      if (settings.name) nameInput.value = settings.name;
      if (settings.max) maxNumInput.value = settings.max;
    }
  } catch (e) {}
}

function saveSettings() {
  const settings = {
    name: nameInput.value.trim(),
    max: maxNumInput.value
  };
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function generateUniqueProblems(max, op) {
  const all = [];
  for (let a = MIN; a <= max; a++) {
    for (let b = MIN; b <= max; b++) {
      let display, answer;
      if (op === '+') {
        display = `${a} + ${b}`;
        answer = a + b;
      } else if (op === '−') {
        if (a < b) continue; // only non-negative results
        display = `${a} − ${b}`;
        answer = a - b;
      } else if (op === '×') {
        display = `${a} × ${b}`;
        answer = a * b;
      } else if (op === '÷') {
        const product = a * b;
        display = `${product} ÷ ${a}`;
        answer = b;
      }
      all.push({ display, answer });
    }
  }
  // Shuffle
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  return all.slice(0, TARGET_TOTAL);
}

function formatTime(totalSeconds) {
  const mins = Math.floor(totalSeconds / 60);
  const secs = Math.floor(totalSeconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function getSpeedRating(avgSeconds) {
  if (avgSeconds < 3) return { emoji: "⚡️", text: "Lightning - Instant" };
  if (avgSeconds < 3.5) return { emoji: "🦅", text: "Eagle - Extreme Speed" };
  if (avgSeconds < 4.5) return { emoji: "🐆", text: "Cheetah - Very Fast" };
  if (avgSeconds < 5.5) return { emoji: "🐎", text: "Horse - Fast" };
  if (avgSeconds < 7) return { emoji: "🐕‍🦺", text: "Dog - Average" };
  if (avgSeconds < 8) return { emoji: "🦔", text: "Hedgehog - Below Average" };
  if (avgSeconds < 9) return { emoji: "🐢", text: "Turtle - Slow" };
  if (avgSeconds < 10) return { emoji: "🦥", text: "Sloth - Very Slow" };
  return { emoji: "🐌", text: "Snail - Extremely Slow" };
}

function getAccuracyRating(percentage) {
  if (percentage === 100) return { emoji: "💯", text: "Perfect" };
  if (percentage >= 96) return { emoji: "🎯", text: "Near Perfect" };
  if (percentage >= 88) return { emoji: "😃", text: "Very Good" };
  if (percentage >= 76) return { emoji: "🤓", text: "Good" };
  if (percentage >= 64) return { emoji: "🙂", text: "Fair" };
  if (percentage >= 48) return { emoji: "😕", text: "Poor" };
  return { emoji: "😒", text: "Very Poor" };
}

function setButtonsEnabled(startEnabled, doneEnabled) {
  document.querySelectorAll('.op-btn').forEach(btn => btn.disabled = !startEnabled);
  doneBtnBottom.disabled = !doneEnabled;
}

function hideFlyout() {
  if (currentFlyout) {
    currentFlyout.remove();
    currentFlyout = null;
  }
}

function showFlyout(row, index) {
  hideFlyout();
  const flyout = document.createElement('div');
  flyout.className = 'flyout';
  flyout.innerHTML = `<button class="delete">Delete</button>`;
  document.body.appendChild(flyout);

  const rect = row.getBoundingClientRect();
  flyout.style.left = (rect.left + 20) + 'px';
  flyout.style.top = (rect.bottom + window.scrollY + 4) + 'px';

  const deleteBtn = flyout.querySelector('.delete');
  deleteBtn.onclick = (e) => {
    e.stopPropagation();
    e.preventDefault();
    history.splice(index, 1);
    saveHistory();
    renderHistory();
    hideFlyout();
  };

  currentFlyout = flyout;

  setTimeout(() => {
    const closer = (ev) => {
      if (!flyout.contains(ev.target)) hideFlyout();
    };
    document.addEventListener('click', closer, { once: true });
    document.addEventListener('touchstart', closer, { once: true });
  }, 50);
}




function renderHistory() {
  if (history.length === 0) {
    historyContainer.innerHTML = '';
    return;
  }

  // Find the best entry (highest score, then fastest time) for each operation type
  const champions = {}; // type -> index in history

  history.forEach((entry, index) => {
    const type = entry.type || '×';
    const currentChampIndex = champions[type];

    // First time we see this type
    if (currentChampIndex === undefined) {
      champions[type] = index;
      return;
    }

    const current = history[currentChampIndex];

    const betterScore = entry.percentage > current.percentage;
    const sameScoreFaster =
      entry.percentage === current.percentage && entry.avg < current.avg;

    if (betterScore || sameScoreFaster) {
      champions[type] = index;
    }
  });

  const sorted = [...history].reverse();

  let html = `
    <h2 style="font-size:1.1rem; margin:16px 0 8px 0;">History</h2>
    <table id="historyTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Score</th>
          <th>Time/Ans</th>
        </tr>
      </thead>
      <tbody>
  `;

  sorted.forEach((entry, displayIdx) => {
    const realIndex = history.length - 1 - displayIdx;
    const type = entry.type || '×';

    const isChampion = champions[type] === realIndex;
    const nameDisplay = `${isChampion ? '🏆 ' : ''}${entry.name}`;

    const scoreEmoji = getAccuracyRating(entry.percentage).emoji;
    const timeEmoji = getSpeedRating(entry.avg).emoji;

    html += `
      <tr data-index="${realIndex}">
        <td>${nameDisplay}</td>
        <td><strong>${type}</strong></td>
        <td>${entry.percentage}% ${scoreEmoji}</td>
        <td>${entry.avg.toFixed(1)}s ${timeEmoji}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  historyContainer.innerHTML = html;

  // Event listeners (unchanged)
  document.querySelectorAll('#historyTable tbody tr').forEach(row => {
    row.addEventListener('touchstart', () => {
      longPressTimer = setTimeout(() => {
        const index = parseInt(row.dataset.index);
        showFlyout(row, index);
      }, 500);
    });

    row.addEventListener('touchend', () => clearTimeout(longPressTimer));
    row.addEventListener('touchmove', () => clearTimeout(longPressTimer));

    row.addEventListener('mousedown', () => {
      longPressTimer = setTimeout(() => {
        const index = parseInt(row.dataset.index);
        showFlyout(row, index);
      }, 500);
    });

    row.addEventListener('mouseup', () => clearTimeout(longPressTimer));
    row.addEventListener('mouseleave', () => clearTimeout(longPressTimer));
  });
}


function highlightRow(input) {
  document.querySelectorAll('.focused-row').forEach(row => row.classList.remove('focused-row'));
  if (input) {
    const row = input.closest('tr');
    if (row) row.classList.add('focused-row');
  }
}

function advanceToNextEmpty() {
  const inputs = Array.from(document.querySelectorAll('input.answer:not([disabled])'));
  const emptyInput = inputs.find(input => input.value.trim() === '');
  if (emptyInput) {
    emptyInput.focus();
    activeInput = emptyInput;
    highlightRow(emptyInput);
  } else {
    finishQuiz();
  }
}

async function enterLockMode() {
  quizActive = true;
  history.pushState({ quiz: true }, '');
  try {
    if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    else if (document.documentElement.webkitRequestFullscreen) await document.documentElement.webkitRequestFullscreen();
  } catch (e) {}
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {}
}

function exitLockMode() {
  quizActive = false;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

function startQuiz(op) {
  clearInterval(timerInterval);
  messageEl.textContent = '';
  answers = [];
  activeInput = null;
  currentOp = op;
  saveSettings();

  const max = Math.max(2, Math.min(20, parseInt(maxNumInput.value) || 12));
  const uniqueProblems = generateUniqueProblems(max, op);

  actualTotal = uniqueProblems.length;
  problemCountEl.textContent = `Problems: ${actualTotal}` + (actualTotal < TARGET_TOTAL ? ` (only ${actualTotal} unique with max ${max})` : '');

  tbody.innerHTML = '';
  uniqueProblems.forEach((prob, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td class="problem">${prob.display}</td>
      <td>
        <input type="text" inputmode="numeric" pattern="[0-9]*" class="answer" readonly>
        <span class="emoji"></span>
      </td>
    `;
    tbody.appendChild(tr);
    answers.push(prob.answer);
  });

  keypad.classList.add('active');
  startTime = performance.now();
  timerInterval = setInterval(updateTimer, 100);
  updateTimer();

  setButtonsEnabled(false, true);
  doneBtnBottom.textContent = 'Quit';
  enterLockMode();

  const firstInput = document.querySelector('input.answer');
  if (firstInput) {
    firstInput.focus();
    activeInput = firstInput;
    highlightRow(firstInput);
  }
}

function updateTimer() {
  if (!startTime) return;
  const elapsed = (performance.now() - startTime) / 1000;
  timerEl.textContent = `Time: ${formatTime(elapsed)}`;
}

function getEmptyAnswerCount() {
  return Array.from(document.querySelectorAll('input.answer'))
    .filter(input => input.value.trim() === '')
    .length;
}


function updateDoneButtonText() {
  const c = getEmptyAnswerCount();

  //messageEl.textContent = `Empty answers: ${c}`;

  doneBtnBottom.textContent =
    c > 0 ? 'Quit' : 'Done';nn
}


function finishQuiz() {
  clearInterval(timerInterval);
  keypad.classList.remove('active');
  exitLockMode();

  const totalSeconds = (performance.now() - startTime) / 1000;
  const avgSeconds = totalSeconds / actualTotal || 1;
  const timeStr = formatTime(totalSeconds);
  timerEl.textContent = `Time: ${timeStr}`;

  let correctCount = 0;
  const rows = tbody.querySelectorAll('tr');

  rows.forEach((row, idx) => {
    const input = row.querySelector('input.answer');
    const emojiSpan = row.querySelector('.emoji');
    const userVal = input.value.trim();
    const correct = answers[idx];

    input.disabled = true;
    row.classList.remove('focused-row');

    if (userVal !== '' && Number(userVal) === correct) {
      input.classList.add('correct');
      emojiSpan.textContent = '✅';
      correctCount++;
    } else {
      input.classList.add('incorrect');
      emojiSpan.textContent = `❌ ${correct}`;
    }
  });

  const percentage = Math.round((correctCount / actualTotal) * 100);
  const childName = nameInput.value.trim() || "Student";
  const speed = getSpeedRating(avgSeconds);
  const accuracy = getAccuracyRating(percentage);

  messageEl.innerHTML = `
    <div><strong>${childName}</strong>'s Results</div>
    <div>Score: <strong>${correctCount}/${actualTotal} (${percentage}%)</strong> ${accuracy.emoji}</div>
    <div>Total time: <strong>${timeStr}</strong></div>
    <div>Average time: <strong>${avgSeconds.toFixed(1)} seconds</strong> per problem ${speed.emoji}</div>
    <div class="rating">Speed: ${speed.emoji} ${speed.text}</div>
    <div class="rating">Accuracy: ${accuracy.emoji} ${accuracy.text}</div>
  `;

if (getEmptyAnswerCount() == 0)

  history.push({
    name: childName,
    type: currentOp,
    percentage,
    scoreEmoji: accuracy.emoji,
    avg: avgSeconds,
    timeEmoji: speed.emoji
  });

  saveHistory();
  renderHistory();
  setButtonsEnabled(true, false);
}

window.addEventListener('popstate', () => {
  if (quizActive) {
    history.pushState({ quiz: true }, '');
    alert('Finish the quiz first!');
  }
});

tbody.addEventListener('focusin', (e) => {
  if (e.target.classList.contains('answer') && !e.target.disabled) {
    activeInput = e.target;
    e.target.value = '';
    highlightRow(e.target);
  }
});

keypad.addEventListener('click', (e) => {
  const key = e.target.closest('.key');
  if (!key || !activeInput || activeInput.disabled) return;
  if (key.id === 'backspaceKey') {
    activeInput.value = activeInput.value.slice(0, -1);
  } else if (key.id === 'enterKey') {
    advanceToNextEmpty();
  } else if (key.dataset.digit) {
    activeInput.value += key.dataset.digit;
  }
  updateDoneButtonText();

});

document.querySelectorAll('.op-btn').forEach(btn => {
  btn.addEventListener('click', () => startQuiz(btn.dataset.op));
});

nameInput.addEventListener('change', saveSettings);
maxNumInput.addEventListener('change', saveSettings);

loadHistory();
loadSettings();
renderHistory();


  
doneBtnBottom.addEventListener('click', finishQuiz);
</script>
</body>
</html>
